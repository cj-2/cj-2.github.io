# O baseURL é substituído automaticamente pelo GitHub Actions no deploy.
baseURL = 'https://example.org/'
locale = 'pt-br'
title = 'cj-2: Blog'
theme = 'lume'
enableRobotsTXT = true

[params]
  description = 'Blog pessoal, de estudos e da minha vida, não vamos nos resumir!'
  author = 'cj-2: Carlos Júnior'
  homeTitle = 'cj-2: Blog on Fire🔥'
  homeIntro = '👺: Meus textos, estudos e reflexões sobre a vida. Não vou me resumir a trabalho aqui, não sou sou um inseto! \n Conhecimento é poder.'
  homePosts = 10   # quantos posts aparecem na página inicial
  toc = true       # sumário nos posts (pode desligar por post com `toc: false`)
  terminalPrompt = 'cj-2@blog'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    pageRef = '/posts'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    pageRef = '/tags'
    weight = 20

[markup.highlight]
  noClasses = false   # usa as classes CSS do tema (claro/escuro)

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.extensions.extras.mark]
  enable = true   # ==destaque== vira <mark>
[markup.goldmark.extensions.extras.insert]
  enable = true   # ++inserido++ vira <ins>
