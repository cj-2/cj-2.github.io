<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav aria-label="Principal">
      <ul class="menu">
        {{ $current := . }}
        {{ range site.Menus.main }}
          <li>
            <a href="{{ .URL | relLangURL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
        {{ end }}
        <li class="menu-controls">
          {{/* Estilo: normal <-> terminal. O ícone mostra o estilo para o qual o botão leva. */}}
          <button class="style-toggle" type="button" aria-label="Mudar para o estilo terminal" title="Mudar para o estilo terminal">
            <svg class="only-normal" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="2.5" y="4" width="19" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7 10 3 2.5L7 15M12.5 15.5H17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="only-terminal" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 19 8.5 5h1L15 19M5 14.5h8M17 19v-6.5a2.5 2.5 0 0 1 5 0V19M17 15.5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          {{/* Cor: sistema -> claro -> escuro -> sistema. O ícone mostra a cor atual. */}}
          <button class="theme-toggle" type="button" aria-label="Cor: segue o sistema" title="Cor: segue o sistema">
            <svg class="icon-system" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</header>
