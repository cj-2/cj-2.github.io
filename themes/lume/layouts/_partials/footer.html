<footer class="site-footer">
  <div class="container">
    <p>
      © {{ now.Year }} {{ with site.Params.author }}{{ . }}{{ else }}{{ site.Title }}{{ end }}
      · Feito com <a href="https://gohugo.io/">Hugo</a>
      {{ with site.Home.OutputFormats.Get "rss" }}· <a href="{{ .RelPermalink }}">RSS</a>{{ end }}
    </p>
  </div>
  <button class="natal-only natal-gnomo" type="button" data-natal="gnomo" aria-label="Gnomo: clique para ouvir uma mensagem"></button>
  <div class="natal-only natal-msg" role="status" aria-live="polite" hidden></div>
</footer>
